<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Valentin Bell, Senior Mobile Software Engineer specializing in iOS, Android, Kotlin Multiplatform, and AI agents.">
    <title>Valentin Bell</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="font" type="font/woff2" crossorigin
        href="https://fonts.gstatic.com/s/materialiconsround/v109/LDItaoyNOAY6Uewc665JcIzCKsKc_M9flwmPq_HTTw.woff2">
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&family=DM+Mono:wght@400&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="theme-color" content="#0f0e0b">
    <meta property="og:title" content="Valentin Bell">
    <meta property="og:description"
        content="Senior Mobile Software Engineer specializing in iOS, Android, Kotlin Multiplatform, and AI agents.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://valentinbell.dev/">
    <meta property="og:image" content="https://valentinbell.dev/og.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Valentin Bell">
    <meta name="twitter:description"
        content="Senior Mobile Software Engineer specializing in iOS, Android, Kotlin Multiplatform, and AI agents.">
    <meta name="twitter:image" content="https://valentinbell.dev/og.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body,
        a,
        button,
        [role="button"],
        label {
            cursor: none;
        }

        input,
        textarea,
        select {
            cursor: text;
        }

        :root {
            --bg: #0f0e0b;
            --fg: #e8e2d4;
            --muted: rgba(232, 226, 212, 0.55);
            --dim: rgba(232, 226, 212, 0.15);
            --border: rgba(232, 226, 212, 0.09);
            --hover: rgba(232, 226, 212, 0.05);
            --accent: #5DACD0;
            --accent-lo: rgba(93, 172, 208, 0.12);
            --accent-hi: rgba(93, 172, 208, 0.30);
            --green: #4dc87a;
            --danger: #ff4444;
            --glow: rgba(93, 172, 208, 0.10);
            --glow2: rgba(93, 172, 208, 0.03);
            --scan: rgba(255, 255, 255, 0.010);
            --now-bg: rgba(255, 255, 255, 0.025);
        }

        [data-theme="light"] {
            --bg: #F5F2E9;
            --fg: #16130F;
            --muted: rgba(22, 19, 15, 0.62);
            --dim: rgba(22, 19, 15, 0.34);
            --border: rgba(22, 19, 15, 0.14);
            --hover: rgba(22, 19, 15, 0.04);
            --accent: #285F78;
            --accent-lo: rgba(40, 95, 120, 0.10);
            --accent-hi: rgba(40, 95, 120, 0.42);
            --green: #2a7a40;
            --danger: #cc2200;
            --glow: rgba(40, 95, 120, 0.08);
            --glow2: rgba(40, 95, 120, 0.03);
            --scan: rgba(0, 0, 0, 0.008);
            --now-bg: rgba(251, 249, 242, 0.42);
        }

        body {
            background: var(--bg);
            color: var(--fg);
            font-family: 'Lora', serif;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 24px 48px;
            transition: background .5s, color .5s;
            -webkit-font-smoothing: antialiased;
            position: relative;
            overflow-x: hidden;
        }

        #cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 36px;
            height: 36px;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: opacity .2s;
        }

        #cursor::before,
        #cursor::after {
            content: '';
            position: absolute;
            background: var(--accent);
            transition: width .2s cubic-bezier(.4, 0, .2, 1),
                height .2s cubic-bezier(.4, 0, .2, 1),
                border-radius .2s,
                top .2s cubic-bezier(.4, 0, .2, 1),
                left .2s cubic-bezier(.4, 0, .2, 1),
                transform .2s cubic-bezier(.4, 0, .2, 1),
                opacity .2s,
                background .5s;
        }

        #cursor::before {
            width: 20px;
            height: 1px;
            top: 50%;
            left: 8px;
            transform: translateY(-50%);
        }

        #cursor::after {
            width: 1px;
            height: 20px;
            left: 50%;
            top: 8px;
            transform: translateX(-50%);
        }

        #cursor-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 1px solid var(--accent);
            opacity: 0;
            transform: scale(0.4);
            transition: opacity .2s, transform .2s cubic-bezier(.4, 0, .2, 1), border-color .5s;
        }

        #cursor.is-hovering::before {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #cursor.is-hovering::after {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
        }

        #cursor.is-hovering #cursor-ring {
            opacity: 1;
            transform: scale(1);
            animation: ring-pulse 1.4s ease-in-out infinite;
        }

        @keyframes ring-pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.18);
                opacity: 0.5;
            }
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background: repeating-linear-gradient(0deg,
                    transparent,
                    transparent 3px,
                    var(--scan) 3px,
                    var(--scan) 4px);
        }

        .glow-orb {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            will-change: transform;
        }

        .orb-a {
            width: 85vmax;
            height: 62vmax;
            left: 8%;
            top: 42%;
            background: radial-gradient(ellipse at center, var(--glow), transparent 70%);
            animation: orb-a-drift 64s ease-in-out infinite, orb-breathe 11s ease-in-out infinite alternate;
        }

        .orb-b {
            width: 38vmax;
            height: 30vmax;
            left: -6%;
            top: 6%;
            background: radial-gradient(ellipse at center, var(--glow2), transparent 65%);
            animation: orb-b-drift 83s ease-in-out infinite, orb-breathe 13s ease-in-out infinite alternate;
        }

        @keyframes orb-breathe {
            from {
                opacity: .65;
            }

            to {
                opacity: 1;
            }
        }

        /* Drift paths with holds: long pauses between each leg */
        @keyframes orb-a-drift {

            0%,
            100% {
                transform: translate(0, 0);
            }

            10% {
                transform: translate(0, 0);
            }

            24% {
                transform: translate(8vw, -4vh);
            }

            32% {
                transform: translate(8vw, -4vh);
            }

            48% {
                transform: translate(-5vw, 5vh);
            }

            56% {
                transform: translate(-5vw, 5vh);
            }

            72% {
                transform: translate(4vw, 2vh);
            }

            80% {
                transform: translate(4vw, 2vh);
            }
        }

        @keyframes orb-b-drift {

            0%,
            100% {
                transform: translate(0, 0);
            }

            12% {
                transform: translate(0, 0);
            }

            26% {
                transform: translate(30vw, 18vh);
            }

            36% {
                transform: translate(30vw, 18vh);
            }

            54% {
                transform: translate(8vw, 34vh);
            }

            64% {
                transform: translate(8vw, 34vh);
            }

            82% {
                transform: translate(4vw, 6vh);
            }

            92% {
                transform: translate(4vw, 6vh);
            }
        }

        .stagger-in {
            opacity: 0;
            transform: translateY(15px);
            animation: slideUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .stagger-in {
                animation: none;
                opacity: 1;
                transform: none;
            }

            .glow-orb {
                animation: none !important;
                opacity: 1;
            }

            .adot {
                animation: none;
                opacity: 1;
            }

            .boot-status-text.offline {
                animation: none;
            }

            .waveform-bar {
                animation: none !important;
                opacity: 0.4;
            }

            .subtitle-text {
                opacity: 1 !important;
                animation: none !important;
                transform: none !important;
            }

            .ghost-dot {
                animation: none;
            }

            .ghost-dot::before {
                animation: none;
                opacity: .6;
            }

            body.destabilize .card,
            body.destabilize::after {
                animation: none;
            }

            body.jolt-light .card,
            body.jolt-heavy .card {
                animation: none;
            }

            body.tv-off .card {
                animation: none;
                opacity: 0;
            }

            body.tv-on .card {
                animation: none;
            }

            #tv-dot.lingering {
                animation: none;
                opacity: 0;
            }
        }

        .boot-status-text {
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            transition: color 0.5s, opacity 1s ease-out;
        }

        .boot-status-text.offline {
            color: var(--danger);
            animation: glitch 1s infinite;
        }

        .boot-status-text.online {
            color: var(--green);
            animation: none;
        }

        .boot-status-text.hidden {
            opacity: 0;
            pointer-events: none;
        }

        @keyframes glitch {

            0%,
            100% {
                transform: skew(0deg);
                text-shadow: 0 0 0 rgba(255, 0, 0, .8);
            }

            20% {
                transform: skew(2deg);
                text-shadow: 2px -1px 0 rgba(255, 0, 0, .6);
            }

            40% {
                transform: skew(-3deg);
                text-shadow: -3px 2px 0 rgba(255, 0, 0, .4);
            }

            60% {
                transform: skew(1deg);
                text-shadow: 1px -2px 0 rgba(255, 0, 0, .7);
            }

            80% {
                transform: skew(-2deg);
                text-shadow: -2px 1px 0 rgba(255, 0, 0, .5);
            }
        }

        .toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: none;
            transition: border-color .2s, background .5s;
        }

        .toggle:hover {
            border-color: var(--accent);
            background: var(--hover);
        }

        .toggle:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        .toggle .material-icons-round {
            font-size: 14px;
            color: var(--muted);
            transition: color .2s;
            pointer-events: none;
        }

        .toggle:hover .material-icons-round {
            color: var(--accent);
        }

        .mono {
            font-family: 'DM Mono', monospace;
        }

        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
        }

        .top-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
            min-height: 24px;
        }

        .tm-right {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 10px;
            letter-spacing: .07em;
            color: var(--muted);
            margin-left: auto;
        }

        .avail-pill:hover {
            color: var(--green) !important;
            border-color: rgba(77, 200, 122, 0.2) !important;
            background-color: transparent !important;
            cursor: default;
        }

        [data-theme="light"] .avail-pill:hover {
            border-color: rgba(42, 122, 64, 0.2) !important;
        }

        .adot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--green);
            animation: adot 2.4s ease-in-out infinite;
        }

        @keyframes adot {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .2;
            }
        }

        .name {
            font-size: clamp(1.8rem, 6vw, 2.7rem);
            font-weight: 500;
            letter-spacing: -.025em;
            margin-bottom: 8px;
            transition: color .5s;
        }

        .name em {
            font-style: italic;
            color: var(--accent);
        }

        .role {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 4px 14px;
            margin-bottom: 14px;
            font-size: 11px;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--muted);
            transition: color .5s;
        }

        .role .stack {
            letter-spacing: .06em;
            opacity: .75;
        }

        .subtitle {
            position: relative;
            min-height: 28px;
            margin-bottom: 20px;
            font-size: clamp(.95rem, 2.4vw, 1.08rem);
            font-style: italic;
            color: var(--muted);
            line-height: 1.5;
            overflow: hidden;
            transition: color .5s;
        }

        .subtitle-text {
            display: block;
            opacity: 0;
            position: absolute;
        }

        .subtitle-text.glitch-in {
            animation: crt-in .5s cubic-bezier(.16, 1, .3, 1) forwards;
        }

        .subtitle-text.shaking {
            animation: pre-shake .55s linear forwards;
        }

        .subtitle-text.glitch-out {
            animation: crt-out .28s cubic-bezier(.4, 0, 1, 1) forwards;
        }

        @keyframes crt-in {
            0% {
                opacity: 0;
                transform: skewX(5deg) scaleY(.86) scaleX(.97);
                text-shadow: 8px 0 0 rgba(255, 60, 40, .8), -8px 0 0 rgba(40, 160, 255, .8);
                filter: brightness(2.4);
            }

            18% {
                opacity: 1;
                transform: skewX(-3deg) scaleY(.98) scaleX(1.01);
                text-shadow: -3px 0 0 rgba(255, 60, 40, .4), 3px 0 0 rgba(40, 160, 255, .4);
                filter: brightness(1.4);
            }

            42% {
                transform: skewX(1.5deg) scaleY(1) scaleX(.995);
                text-shadow: 1px 0 0 rgba(255, 60, 40, .1);
                filter: brightness(1.05);
            }

            68% {
                transform: skewX(-.5deg) scaleY(1) scaleX(1);
            }

            100% {
                opacity: 1;
                transform: skewX(0) scaleY(1) scaleX(1);
                text-shadow: none;
                filter: brightness(1);
            }
        }

        @keyframes pre-shake {
            0% {
                opacity: 1;
                transform: skewX(0) translateX(0);
                text-shadow: none;
                filter: brightness(1);
            }

            10% {
                opacity: 1;
                transform: skewX(.4deg) translateX(.5px);
                text-shadow: none;
                filter: brightness(1);
            }

            20% {
                opacity: 1;
                transform: skewX(-.3deg) translateX(-1px);
                text-shadow: none;
                filter: brightness(1);
            }

            30% {
                opacity: 1;
                transform: skewX(.6deg) translateX(1px);
                text-shadow: none;
                filter: brightness(1);
            }

            40% {
                opacity: 1;
                transform: skewX(-.5deg) translateX(-1px);
                text-shadow: 1px 0 0 rgba(255, 60, 40, .25), -1px 0 0 rgba(40, 160, 255, .25);
                filter: brightness(1.05);
            }

            50% {
                opacity: 1;
                transform: skewX(1.2deg) translateX(2px);
                text-shadow: 2px 0 0 rgba(255, 60, 40, .4), -2px 0 0 rgba(40, 160, 255, .4);
                filter: brightness(1.1);
            }

            58% {
                opacity: 1;
                transform: skewX(-2deg) translateX(-3px);
                text-shadow: 3px 0 0 rgba(255, 60, 40, .55), -3px 0 0 rgba(40, 160, 255, .55);
                filter: brightness(1.2);
            }

            66% {
                opacity: 1;
                transform: skewX(2.5deg) translateX(3px);
                text-shadow: -4px 0 0 rgba(255, 60, 40, .65), 4px 0 0 rgba(40, 160, 255, .65);
                filter: brightness(1.35);
            }

            74% {
                opacity: 1;
                transform: skewX(-3deg) translateX(-4px);
                text-shadow: 5px 0 0 rgba(255, 60, 40, .75), -5px 0 0 rgba(40, 160, 255, .75);
                filter: brightness(1.5);
            }

            82% {
                opacity: 1;
                transform: skewX(4deg) translateX(4px);
                text-shadow: -6px 0 0 rgba(255, 60, 40, .8), 6px 0 0 rgba(40, 160, 255, .8);
                filter: brightness(1.7);
            }

            90% {
                opacity: 1;
                transform: skewX(-5deg) translateX(-5px);
                text-shadow: 7px 0 0 rgba(255, 60, 40, .9), -7px 0 0 rgba(40, 160, 255, .9);
                filter: brightness(1.9);
            }

            100% {
                opacity: 1;
                transform: skewX(6deg) translateX(5px);
                text-shadow: -8px 0 0 rgba(255, 60, 40, 1), 8px 0 0 rgba(40, 160, 255, 1);
                filter: brightness(2.2);
            }
        }

        @keyframes crt-out {
            0% {
                opacity: 1;
                transform: skewX(6deg) scaleY(.96) scaleX(1.02);
                text-shadow: -8px 0 0 rgba(255, 60, 40, 1), 8px 0 0 rgba(40, 160, 255, 1);
                filter: brightness(2.2);
            }

            35% {
                opacity: .4;
                transform: skewX(-12deg) scaleY(.88) scaleX(.98);
                filter: brightness(2.5);
            }

            100% {
                opacity: 0;
                transform: skewX(4deg) scaleY(.82) scaleX(1);
                text-shadow: none;
                filter: brightness(1);
            }
        }

        .links {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .lnk {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 13px;
            color: var(--muted);
            text-decoration: none;
            background: transparent;
            transition: color .18s, border-color .18s, background-color .18s;
        }

        .lnk:hover {
            color: var(--fg);
            border-color: var(--accent-hi);
            background-color: var(--accent-lo);
        }

        .lnk:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        .lnk .material-icons-round {
            font-size: 13px;
        }

        .lnk svg {
            width: 13px;
            height: 13px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .lnk-email {
            position: relative;
            overflow: hidden;
        }

        .lnk-default,
        .copy-label {
            display: flex;
            align-items: center;
            gap: 6px;
            transition: opacity .2s, transform .2s;
        }

        .copy-label {
            position: absolute;
            inset: 0;
            justify-content: center;
            color: var(--accent);
            opacity: 0;
            transform: translateY(100%);
            pointer-events: none;
        }

        .lnk-email.copied .lnk-default {
            opacity: 0;
            transform: translateY(-100%);
        }

        .lnk-email.copied .copy-label {
            opacity: 1;
            transform: translateY(0);
        }

        .now-bar {
            background: var(--now-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            transition: background .5s, border-color .5s;
        }

        /* Vitrine borrow: in light mode the now-bar becomes a glass pane */
        [data-theme="light"] .now-bar {
            border-color: rgba(22, 19, 15, 0.32);
            -webkit-backdrop-filter: blur(9px) saturate(1.05);
            backdrop-filter: blur(9px) saturate(1.05);
        }

        @media (max-width: 400px) {
            .now-bar {
                grid-template-columns: 1fr;
                gap: 10px;
            }
        }

        .now-item {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            min-width: 0;
        }

        .now-icon {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .now-icon .material-icons-round {
            font-size: 12px;
            color: var(--accent);
            opacity: .7;
        }

        .now-icon svg {
            width: 12px;
            height: 12px;
            fill: var(--accent);
            opacity: .7;
        }

        .now-text {
            font-size: 13px;
            line-height: 1.55;
            color: var(--muted);
            min-width: 0;
            transition: color .5s;
        }

        .now-label {
            font-size: 9px;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--accent);
            opacity: .55;
            margin-bottom: 2px;
        }

        .now-primary {
            color: var(--fg);
            font-size: 11px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.4;
        }

        .now-secondary {
            font-size: 10px;
            opacity: .6;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.4;
        }

        .now-link {
            text-decoration: none;
            color: inherit;
        }

        .waveform {
            display: flex;
            align-items: center;
            gap: 2px;
            height: 11px;
            margin-top: 4px;
            opacity: 1;
            transition: opacity .3s;
        }

        .waveform.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .waveform-bar {
            width: 2px;
            border-radius: 1px;
            background: var(--accent);
            opacity: 0.7;
            transform-origin: bottom center;
        }

        /* Waveform only animates when actively playing */
        .waveform.playing .waveform-bar:nth-child(1) {
            animation: wave 1.1s ease-in-out infinite 0.00s;
        }

        .ghost-dot {
            position: fixed;
            bottom: 8vh;
            left: 10vw;
            width: 44px;
            height: 44px;
            padding: 0;
            border: none;
            background: transparent;
            z-index: 2;
            cursor: none;
            transition: opacity 1.2s;
            animation: ghost-wander 38s ease-in-out infinite;
        }

        .ghost-dot:hover,
        .ghost-dot:focus-visible,
        .ghost-dot.triggered {
            animation-play-state: paused;
        }

        /* Confined to the bottom band so it never passes under the buttons */
        @keyframes ghost-wander {

            0%,
            8% {
                transform: translate(0, 0);
            }

            22%,
            30% {
                transform: translate(55vw, -5vh);
            }

            46%,
            54% {
                transform: translate(76vw, -2vh);
            }

            70%,
            78% {
                transform: translate(30vw, -8vh);
            }

            100% {
                transform: translate(0, 0);
            }

        .ghost-speck {

            z-index: 2;
            animation: speck-flicker 1.9s linear forwards;

        @keyframes speck-flicker {

            0% {
                opacity: .75;
            }

            15% {
                opacity: .2;
            }

            30% {
                opacity: .6;
            }

            45% {
                opacity: .15;
            }

            60% {
                opacity: .45;
            }

            75% {
                opacity: .1;
            }

            100% {
                opacity: 0;
            }
        }

        .ghost-dot::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle, var(--accent-lo) 0%, var(--glow) 45%, transparent 70%);
            filter: blur(7px);
            animation: ghost-halo 6.5s ease-in-out infinite;
        }

        .ghost-dot:hover::before,
        .ghost-dot:focus-visible::before {
            animation-duration: 2s;
        }

        .ghost-dot:focus-visible {
            outline: none;
        }

        .ghost-dot.resolved {
            opacity: 0;
            pointer-events: none;

        @keyframes ghost-halo {

            0%,
            100% {
                transform: scale(.85);
                opacity: .55;

            50% {
                transform: scale(1.15);
                opacity: 1;
            }

    <script>
        // kick icon font fetch early; survives future Google font version bumps
        if (document.fonts) {
            document.fonts.load("14px 'Material Icons Round'");
        }

        const BOOT_ONLINE_DELAY = 1500;
        const BOOT_FADE_DELAY = 3000;
        const CLOCK_INTERVAL = 1000;
        const LB_POLL_INTERVAL = 30000;
        const GH_POLL_INTERVAL = 300000;
        const WX_POLL_INTERVAL = 600000;
        const WX_ROTATE_MS = 7000;
        const WX_CITIES = [
            { full: 'Bangkok, Thailand', lat: 13.7563, lon: 100.5018, tz: 'Asia/Bangkok', tzShort: 'ICT' },
            { full: 'Paris, France', lat: 48.8566, lon: 2.3522, tz: 'Europe/Paris', tzShort: null },
        ];
        const wxData = WX_CITIES.map(() => null);
        let wxIndex = 0;
        const EMAIL = 'contact@valentinbell.dev';
        const LB_USER = 'valebell';
        const GH_USER = 'valebell';

        const SUBTITLE_LINES = [
            'Building things that fit in pockets.',
            "The stack shifts. The drive to learn doesn't.",
            'Clean architecture, messy problems.',
            'Tinkering with AI agents in my spare time.',
            'Paris → Bangkok → Wherever',
        ];
        const SUBTITLE_DISPLAY_MS = 2650;
        const SUBTITLE_SHAKE_MS = 550;

        const statusText = document.getElementById('boot-status');
        const toggleBtn = document.querySelector('.toggle');
        const toggleIcon = document.getElementById('toggle-icon');
        const footClock = document.getElementById('foot-clock');
        const footPlace = document.getElementById('foot-place');
        const ghPrimary = document.getElementById('gh-primary');
        const ghSecondary = document.getElementById('gh-secondary');
        const ghLink = document.getElementById('gh-link');
        const ghLabel = document.getElementById('gh-label');
        const lbPrimary = document.getElementById('lb-primary');
        const lbSecondary = document.getElementById('lb-secondary');
        const lbLink = document.getElementById('lb-link');
        const waveform = document.getElementById('waveform');
        const emailBtn = document.getElementById('email-btn');
        const kbdHint = document.getElementById('kbd-hint');
        const cursorEl = document.getElementById('cursor');

        document.addEventListener('mousemove', e => {
            cursorEl.style.left = `${e.clientX}px`;
            cursorEl.style.top = `${e.clientY}px`;
        });
        document.addEventListener('mouseleave', () => { cursorEl.style.opacity = '0'; });
        document.addEventListener('mouseenter', () => { cursorEl.style.opacity = '1'; });

        const CLICKABLE_SELECTOR = 'a, button, [role="button"], label, .stack-tag, .now-link';
        let hoverables = new WeakSet(document.querySelectorAll(CLICKABLE_SELECTOR));

        const hoverObserver = new MutationObserver(() => {
            hoverables = new WeakSet(document.querySelectorAll(CLICKABLE_SELECTOR));
        });
        hoverObserver.observe(document.body, { childList: true, subtree: true });

        document.addEventListener('mouseover', e => {
            if (e.target.closest && e.target.closest(CLICKABLE_SELECTOR)) {
                cursorEl.classList.add('is-hovering');
            }
        });
        document.addEventListener('mouseout', e => {
            if (e.target.closest && e.target.closest(CLICKABLE_SELECTOR)) {
                cursorEl.classList.remove('is-hovering');
            }
        });

        function runBootStatus() {
            statusText.classList.remove('hidden', 'online');
            statusText.classList.add('offline');
            statusText.textContent = 'SYSTEM OFFLINE';

            setTimeout(() => {
                statusText.classList.replace('offline', 'online');
                statusText.textContent = 'SYSTEM ONLINE';
                setTimeout(() => statusText.classList.add('hidden'), BOOT_FADE_DELAY);
            }, BOOT_ONLINE_DELAY);
        }

        window.addEventListener('load', () => {
            runBootStatus();

            setTimeout(() => {
                if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
                    kbdHint.classList.add('show');
                    setTimeout(() => kbdHint.classList.remove('show'), 3500);
                }
            }, 2000);
        });

        const clockFmts = WX_CITIES.map(c => new Intl.DateTimeFormat('en-GB', {
            timeZone: c.tz,
            hour: '2-digit', minute: '2-digit', hour12: false,
            timeZoneName: 'short',
        }));

        function clockText() {
            const parts = clockFmts[wxIndex].formatToParts(new Date());
            const get = t => parts.find(p => p.type === t)?.value ?? '';
            const abbr = WX_CITIES[wxIndex].tzShort ?? get('timeZoneName');
            return `${get('hour')}:${get('minute')} ${abbr}`;
        }

        function tick() { footClock.textContent = clockText(); }
        tick();
        setInterval(tick, CLOCK_INTERVAL);

        function toggleTheme() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
            toggleIcon.textContent = isDark ? 'dark_mode' : 'light_mode';
            toggleBtn.setAttribute('aria-label', isDark ? 'Switch to dark mode' : 'Switch to light mode');
            toggleBtn.setAttribute('aria-pressed', String(!isDark));
        }

        document.addEventListener('keydown', e => {
            if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
            if (e.key === 't' || e.key === 'T') toggleTheme();
        });

        let copyTimer = null;
        function copyEmail(e) {
            if (e && (e.shiftKey || e.metaKey || e.ctrlKey)) return;
            e.preventDefault();
            if (!navigator.clipboard) {
                try {
                    const ta = document.createElement('textarea');
                    ta.value = EMAIL;
                    ta.style.position = 'fixed';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    showCopied();
                } catch {
                    // silent fail, don't do anything more
                }
                return;
            }

            navigator.clipboard.writeText(EMAIL)
                .then(showCopied)
                .catch(() => {
                    // clipboard write was denied, no visual feedback change
                });
        }

        function showCopied() {
            emailBtn.classList.add('copied');
            clearTimeout(copyTimer);
            copyTimer = setTimeout(() => emailBtn.classList.remove('copied'), 2000);
        }

        const subtitleEl = document.getElementById('subtitle-text');
        let lineIndex = 0;

        function setSubtitleAnim(name) {
            subtitleEl.classList.remove('glitch-in', 'shaking', 'glitch-out');
            void subtitleEl.offsetWidth;
            if (name) subtitleEl.classList.add(name);

                const nowData = await nowRes.json();

                if (nowData?.payload?.count > 0) {
                    const t = nowData.payload.listens[0]?.track_metadata;
                    if (t) {
                        setTrack(t.track_name, t.artist_name, true, t.additional_info, t.mbid_mapping?.recording_mbid);
                        return;
                    }
                }

                const recRes = await fetch(`https://api.listenbrainz.org/1/user/${LB_USER}/listens?count=1`);
                if (!recRes.ok) throw new Error(`LB ${recRes.status}`);
                const recData = await recRes.json();

                if (recData?.payload?.listens?.length > 0) {
                    const t = recData.payload.listens[0]?.track_metadata;
                    if (t) {
                        setTrack(t.track_name, t.artist_name, false, t.additional_info, t.mbid_mapping?.recording_mbid);

        function timeAgo(date) {
            const s = Math.floor((Date.now() - date) / 1000);
            if (s < 60) return `${s}s ago`;
            if (s < 3600) return `${Math.floor(s / 60)}m ago`;
            const h = Math.floor(s / 3600);
            if (h < 24) return `${h}h ago`;
            return `${Math.floor(h / 24)}d ago`;

        const GH_EVENT_EXTRACTORS = {
            PullRequestEvent: (ev) => {
                const pr = ev.payload?.pull_request;
                return pr?.title ? { text: pr.title, href: pr.html_url } : null;
            },
            PushEvent: (ev) => {
                const commits = ev.payload?.commits || [];
                const head = commits.find(c => c.sha === ev.payload?.head);
                const fallback = commits.find(c => c.message?.trim());
                const commit = head || fallback;
                if (!commit && !ev.payload?.head) return null;
                return {
                    text: commit?.message?.split('\n')[0] || 'pushed commits',
                    href: `https://github.com/${ev.repo.name}/commit/${ev.payload.head}`,
                };
            },
            CreateEvent: (ev) => {
                const label = ev.payload?.description?.trim()
                    || (ev.payload?.ref ? `created ${ev.payload.ref_type} ${ev.payload.ref}` : null);
                return label ? { text: label, href: `https://github.com/${ev.repo.name}` } : null;
            },
        };

        async function latestRepo() {
            try {
                const res = await fetch(`https://api.github.com/users/${GH_USER}/repos?sort=pushed&per_page=100`);
                if (!res.ok) return null;
                const repos = await res.json();
                const repo = repos.find(r => !r.fork && r.name !== GH_USER && r.name !== `${GH_USER}.github.io`);
                if (!repo?.pushed_at) return null;
                return {
                    name: repo.name,
                    href: repo.html_url,
                    meta: [repo.language, timeAgo(new Date(repo.pushed_at))].filter(Boolean).join(' · '),
                };
            } catch {
                return null;
            }
        }

        async function loadGH() {
            try {
                const res = await fetch(`https://api.github.com/users/${GH_USER}/events/public?per_page=100`);
                if (res.status === 403 || res.status === 429) {
                    setCommit('rate limit — try later', ghLink.href, '');
                    return;
                }
                if (!res.ok) throw new Error(`GitHub Events API ${res.status}`);
                const events = await res.json();

                const latest = events.find(ev => GH_EVENT_EXTRACTORS[ev.type]?.(ev));

                if (!latest || (Date.now() - new Date(latest.created_at).getTime()) > QUIET_AFTER_MS) {
                    const repo = await latestRepo();
                    if (repo) {
                        setGhLabel('latest project');
                        setCommit(repo.name, repo.href, repo.meta);
                        return;
                    }
                    setCommit('find me on github', GH_PROFILE_URL, '');
                    return;
                }

                setGhLabel('latest activity');

                const data = GH_EVENT_EXTRACTORS[latest.type](latest);
                const repoLabel = latest.repo.name.split('/')[1] || latest.repo.name;

                setCommit(data.text, data.href, `${repoLabel} · ${timeAgo(new Date(latest.created_at))}`);
            } catch (err) {
                console.warn('GitHub fetch failed:', err);
                setCommit('unavailable', ghLink.href, '');
            }
        }

            speck.addEventListener('animationend', () => speck.remove(), { once: true });
            document.body.appendChild(speck);
        }

        setInterval(() => {
            if (ghostDot.classList.contains('resolved') || ghostDot.classList.contains('triggered')) return;
            if (getComputedStyle(ghostDot).animationPlayState === 'paused') {
                lastSpeckPos = null;
                return;
            }
            const r = ghostDot.getBoundingClientRect();
            const cx = r.left + r.width / 2;
            const cy = r.top + r.height / 2;
            if (!lastSpeckPos) {
                lastSpeckPos = { x: cx, y: cy };
                return;
            }
            const dx = cx - lastSpeckPos.x;
            const dy = cy - lastSpeckPos.y;
            const dist = Math.hypot(dx, dy);
            if (dist < SPECK_MIN_MOVE_PX) return;
            lastSpeckPos = { x: cx, y: cy };

            // snake the trail perpendicular to travel, like a wave behind the signal
            speckPhase += dist;
            const wave = Math.sin((speckPhase / SPECK_WAVE_LENGTH) * Math.PI * 2) * SPECK_WAVE_AMPLITUDE;
            spawnSpeck(cx + (-dy / dist) * wave, cy + (dx / dist) * wave);
        }, SPECK_INTERVAL_MS);
    </script>
</body>

</html>
