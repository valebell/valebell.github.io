<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Portfolio of Valentin Bell, Senior Mobile Software Engineer specializing in iOS, Android, and Kotlin Multiplatform.">
    <title>Valentin Bell</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&family=DM+Mono:wght@400&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body,
        a,
        button,
        [role="button"],
        label {
            cursor: none;
        }

        input,
        textarea,
        select {
            cursor: text;
        }

        :root {
            --bg: #0f0e0b;
            --fg: #e8e2d4;
            --muted: rgba(232, 226, 212, 0.55);
            --dim: rgba(232, 226, 212, 0.15);
            --border: rgba(232, 226, 212, 0.09);
            --hover: rgba(232, 226, 212, 0.05);
            --accent: #c8a060;
            --accent-lo: rgba(200, 160, 96, 0.10);
            --accent-hi: rgba(200, 160, 96, 0.26);
            --green: #4dc87a;
            --danger: #ff4444;
            --glow: rgba(200, 140, 50, 0.12);
            --glow2: rgba(200, 140, 50, 0.04);
            --scan: rgba(255, 255, 255, 0.010);
            --now-bg: rgba(255, 255, 255, 0.025);
        }

        [data-theme="light"] {
            --bg: #f0e6d8;
            --fg: #1c1810;
            --muted: rgba(28, 24, 16, 0.52);
            --dim: rgba(28, 24, 16, 0.18);
            --border: rgba(28, 24, 16, 0.10);
            --hover: rgba(28, 24, 16, 0.04);
            --accent: #b85c2a;
            --accent-lo: rgba(184, 92, 42, 0.08);
            --accent-hi: rgba(184, 92, 42, 0.22);
            --green: #2a7a40;
            --danger: #cc2200;
            --glow: rgba(184, 92, 42, 0.09);
            --glow2: rgba(184, 92, 42, 0.04);
            --scan: rgba(0, 0, 0, 0.008);
            --now-bg: rgba(0, 0, 0, 0.025);
        }

        body {
            background: var(--bg);
            color: var(--fg);
            font-family: 'Lora', serif;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 52px 24px 60px;
            transition: background .5s, color .5s;
            -webkit-font-smoothing: antialiased;
            position: relative;
            overflow-x: hidden;
        }

        #cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 36px;
            height: 36px;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: opacity .2s;
        }

        #cursor::before,
        #cursor::after {
            content: '';
            position: absolute;
            background: var(--accent);
            transition: width .2s cubic-bezier(.4, 0, .2, 1),
                height .2s cubic-bezier(.4, 0, .2, 1),
                border-radius .2s,
                top .2s cubic-bezier(.4, 0, .2, 1),
                left .2s cubic-bezier(.4, 0, .2, 1),
                transform .2s cubic-bezier(.4, 0, .2, 1),
                opacity .2s,
                background .5s;
        }

        #cursor::before {
            width: 20px;
            height: 1px;
            top: 50%;
            left: 8px;
            transform: translateY(-50%);
        }

        #cursor::after {
            width: 1px;
            height: 20px;
            left: 50%;
            top: 8px;
            transform: translateX(-50%);
        }

        #cursor-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 1px solid var(--accent);
            opacity: 0;
            transform: scale(0.4);
            transition: opacity .2s, transform .2s cubic-bezier(.4, 0, .2, 1), border-color .5s;
        }

        #cursor.is-hovering::before {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #cursor.is-hovering::after {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
        }

        #cursor.is-hovering #cursor-ring {
            opacity: 1;
            transform: scale(1);
            animation: ring-pulse 1.4s ease-in-out infinite;
        }

        @keyframes ring-pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.18);
                opacity: 0.5;
            }
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background: repeating-linear-gradient(0deg,
                    transparent,
                    transparent 3px,
                    var(--scan) 3px,
                    var(--scan) 4px);
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(ellipse 60% 50% at 50% 82%, var(--glow), transparent 70%),
                radial-gradient(ellipse 30% 28% at 16% 20%, var(--glow2), transparent 60%);
            animation: breathe 11s ease-in-out infinite alternate;
        }

        @keyframes breathe {
            from {
                opacity: .65;
            }

            to {
                opacity: 1;
            }
        }

        .stagger-in {
            opacity: 0;
            transform: translateY(15px);
            animation: slideUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .stagger-in {
                animation: none;
                opacity: 1;
                transform: none;
            }

            body::before {
                animation: none;
            }

            .adot {
                animation: none;
                opacity: 1;
            }

            .boot-status-text.offline {
                animation: none;
            }

            .waveform-bar {
                animation: none !important;
                opacity: 0.4;
            }

            .subtitle-text {
                opacity: 1 !important;
                animation: none !important;
                transform: none !important;
            }
        }

        .boot-status-text {
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            transition: color 0.5s, opacity 1s ease-out;
        }

        .boot-status-text.offline {
            color: var(--danger);
            animation: glitch 1s infinite;
        }

        .boot-status-text.online {
            color: var(--green);
            animation: none;
        }

        .boot-status-text.hidden {
            opacity: 0;
            pointer-events: none;
        }

        @keyframes glitch {

            0%,
            100% {
                transform: skew(0deg);
                text-shadow: 0 0 0 rgba(255, 0, 0, .8);
            }

            20% {
                transform: skew(2deg);
                text-shadow: 2px -1px 0 rgba(255, 0, 0, .6);
            }

            40% {
                transform: skew(-3deg);
                text-shadow: -3px 2px 0 rgba(255, 0, 0, .4);
            }

            60% {
                transform: skew(1deg);
                text-shadow: 1px -2px 0 rgba(255, 0, 0, .7);
            }

            80% {
                transform: skew(-2deg);
                text-shadow: -2px 1px 0 rgba(255, 0, 0, .5);
            }
        }

        .toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: none;
            transition: border-color .2s, background .5s;
        }

        .toggle:hover {
            border-color: var(--accent);
            background: var(--hover);
        }

        .toggle:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        .toggle .material-icons-round {
            font-size: 14px;
            color: var(--muted);
            transition: color .2s;
            pointer-events: none;
        }

        .toggle:hover .material-icons-round {
            color: var(--accent);
        }

        .mono {
            font-family: 'DM Mono', monospace;
        }

        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
        }

        .top-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            min-height: 24px;
        }

        .tm-right {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 9px;
            letter-spacing: .07em;
            color: var(--muted);
            margin-left: auto;
        }

        .avail-pill:hover {
            color: var(--green) !important;
            border-color: rgba(77, 200, 122, 0.2) !important;
            background-color: transparent !important;
            cursor: default;
        }

        [data-theme="light"] .avail-pill:hover {
            border-color: rgba(42, 122, 64, 0.2) !important;
        }

        .adot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--green);
            animation: adot 2.4s ease-in-out infinite;
        }

        @keyframes adot {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .2;
            }
        }

        .name {
            font-size: clamp(1.8rem, 6vw, 2.7rem);
            font-weight: 500;
            letter-spacing: -.025em;
            margin-bottom: 18px;
            transition: color .5s;
        }

        .name em {
            font-style: italic;
            color: var(--accent);
        }

        .subtitle {
            position: relative;
            min-height: 28px;
            margin-bottom: 28px;
            font-size: clamp(.88rem, 2.4vw, 1.0rem);
            font-style: italic;
            color: var(--muted);
            line-height: 1.5;
            overflow: hidden;
            transition: color .5s;
        }

        .subtitle-text {
            display: block;
            opacity: 0;
            position: absolute;
        }

        .subtitle-text.glitch-in {
            animation: crt-in .5s cubic-bezier(.16, 1, .3, 1) forwards;
        }

        .subtitle-text.shaking {
            animation: pre-shake .55s linear forwards;
        }

        .subtitle-text.glitch-out {
            animation: crt-out .28s cubic-bezier(.4, 0, 1, 1) forwards;
        }

        @keyframes crt-in {
            0% {
                opacity: 0;
                transform: skewX(5deg) scaleY(.86) scaleX(.97);
                text-shadow: 8px 0 0 rgba(255, 60, 40, .8), -8px 0 0 rgba(40, 160, 255, .8);
                filter: brightness(2.4);
            }

            18% {
                opacity: 1;
                transform: skewX(-3deg) scaleY(.98) scaleX(1.01);
                text-shadow: -3px 0 0 rgba(255, 60, 40, .4), 3px 0 0 rgba(40, 160, 255, .4);
                filter: brightness(1.4);
            }

            42% {
                transform: skewX(1.5deg) scaleY(1) scaleX(.995);
                text-shadow: 1px 0 0 rgba(255, 60, 40, .1);
                filter: brightness(1.05);
            }

            68% {
                transform: skewX(-.5deg) scaleY(1) scaleX(1);
            }

            100% {
                opacity: 1;
                transform: skewX(0) scaleY(1) scaleX(1);
                text-shadow: none;
                filter: brightness(1);
            }
        }

        @keyframes pre-shake {
            0% {
                opacity: 1;
                transform: skewX(0) translateX(0);
                text-shadow: none;
                filter: brightness(1);
            }

            10% {
                opacity: 1;
                transform: skewX(.4deg) translateX(.5px);
                text-shadow: none;
                filter: brightness(1);
            }

            20% {
                opacity: 1;
                transform: skewX(-.3deg) translateX(-1px);
                text-shadow: none;
                filter: brightness(1);
            }

            30% {
                opacity: 1;
                transform: skewX(.6deg) translateX(1px);
                text-shadow: none;
                filter: brightness(1);
            }

            40% {
                opacity: 1;
                transform: skewX(-.5deg) translateX(-1px);
                text-shadow: 1px 0 0 rgba(255, 60, 40, .25), -1px 0 0 rgba(40, 160, 255, .25);
                filter: brightness(1.05);
            }

            50% {
                opacity: 1;
                transform: skewX(1.2deg) translateX(2px);
                text-shadow: 2px 0 0 rgba(255, 60, 40, .4), -2px 0 0 rgba(40, 160, 255, .4);
                filter: brightness(1.1);
            }

            58% {
                opacity: 1;
                transform: skewX(-2deg) translateX(-3px);
                text-shadow: 3px 0 0 rgba(255, 60, 40, .55), -3px 0 0 rgba(40, 160, 255, .55);
                filter: brightness(1.2);
            }

            66% {
                opacity: 1;
                transform: skewX(2.5deg) translateX(3px);
                text-shadow: -4px 0 0 rgba(255, 60, 40, .65), 4px 0 0 rgba(40, 160, 255, .65);
                filter: brightness(1.35);
            }

            74% {
                opacity: 1;
                transform: skewX(-3deg) translateX(-4px);
                text-shadow: 5px 0 0 rgba(255, 60, 40, .75), -5px 0 0 rgba(40, 160, 255, .75);
                filter: brightness(1.5);
            }

            82% {
                opacity: 1;
                transform: skewX(4deg) translateX(4px);
                text-shadow: -6px 0 0 rgba(255, 60, 40, .8), 6px 0 0 rgba(40, 160, 255, .8);
                filter: brightness(1.7);
            }

            90% {
                opacity: 1;
                transform: skewX(-5deg) translateX(-5px);
                text-shadow: 7px 0 0 rgba(255, 60, 40, .9), -7px 0 0 rgba(40, 160, 255, .9);
                filter: brightness(1.9);
            }

            100% {
                opacity: 1;
                transform: skewX(6deg) translateX(5px);
                text-shadow: -8px 0 0 rgba(255, 60, 40, 1), 8px 0 0 rgba(40, 160, 255, 1);
                filter: brightness(2.2);
            }
        }

        @keyframes crt-out {
            0% {
                opacity: 1;
                transform: skewX(6deg) scaleY(.96) scaleX(1.02);
                text-shadow: -8px 0 0 rgba(255, 60, 40, 1), 8px 0 0 rgba(40, 160, 255, 1);
                filter: brightness(2.2);
            }

            35% {
                opacity: .4;
                transform: skewX(-12deg) scaleY(.88) scaleX(.98);
                filter: brightness(2.5);
            }

            100% {
                opacity: 0;
                transform: skewX(4deg) scaleY(.82) scaleX(1);
                text-shadow: none;
                filter: brightness(1);
            }
        }

        .links {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
            margin-bottom: 32px;
        }

        .lnk {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 12px;
            color: var(--muted);
            text-decoration: none;
            background: transparent;
            transition: color .18s, border-color .18s, background-color .18s;
        }

        .lnk:hover {
            color: var(--fg);
            border-color: var(--accent-hi);
            background-color: var(--accent-lo);
        }

        .lnk:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        .lnk .material-icons-round {
            font-size: 12px;
        }

        .lnk svg {
            width: 12px;
            height: 12px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .lnk-email {
            position: relative;
            overflow: hidden;
        }

        .lnk-default,
        .copy-label {
            display: flex;
            align-items: center;
            gap: 6px;
            transition: opacity .2s, transform .2s;
        }

        .copy-label {
            position: absolute;
            inset: 0;
            justify-content: center;
            color: var(--accent);
            opacity: 0;
            transform: translateY(100%);
            pointer-events: none;
        }

        .lnk-email.copied .lnk-default {
            opacity: 0;
            transform: translateY(-100%);
        }

        .lnk-email.copied .copy-label {
            opacity: 1;
            transform: translateY(0);
        }

        .now-bar {
            background: var(--now-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            transition: background .5s, border-color .5s;
        }

        @media (max-width: 400px) {
            .now-bar {
                grid-template-columns: 1fr;
                gap: 10px;
            }
        }

        .now-item {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            min-width: 0;
        }

        .now-icon {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .now-icon .material-icons-round {
            font-size: 11px;
            color: var(--accent);
            opacity: .7;
        }

        .now-icon svg {
            width: 11px;
            height: 11px;
            fill: var(--accent);
            opacity: .7;
        }

        .now-text {
            font-size: 12px;
            line-height: 1.55;
            color: var(--muted);
            min-width: 0;
            transition: color .5s;
        }

        .now-label {
            font-size: 8px;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--accent);
            opacity: .55;
            margin-bottom: 2px;
        }

        .now-primary {
            color: var(--fg);
            font-size: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.4;
        }

        .now-secondary {
            font-size: 9px;
            opacity: .6;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.4;
        }

        .now-link {
            text-decoration: none;
            color: inherit;
        }

        .waveform {
            display: flex;
            align-items: center;
            gap: 2px;
            height: 11px;
            margin-top: 4px;
            opacity: 1;
            transition: opacity .3s;
        }

        .waveform.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .waveform-bar {
            width: 2px;
            border-radius: 1px;
            background: var(--accent);
            opacity: 0.7;
            transform-origin: bottom center;
        }

        /* Waveform only animates when actively playing */
        .waveform.playing .waveform-bar:nth-child(1) {
            animation: wave 1.1s ease-in-out infinite 0.00s;
        }

        .waveform.playing .waveform-bar:nth-child(2) {
            animation: wave 1.3s ease-in-out infinite 0.15s;
        }

        .waveform.playing .waveform-bar:nth-child(3) {
            animation: wave 0.9s ease-in-out infinite 0.05s;
        }

        .waveform.playing .waveform-bar:nth-child(4) {
            animation: wave 1.2s ease-in-out infinite 0.25s;
        }

        .waveform.playing .waveform-bar:nth-child(5) {
            animation: wave 1.0s ease-in-out infinite 0.10s;
        }

        @keyframes wave {

            0%,
            100% {
                height: 3px;
            }

            50% {
                height: 11px;
            }
        }

        .foot {
            margin-top: 16px;
            font-size: 11px;
            letter-spacing: .06em;
            color: var(--muted);
            opacity: .5;
            display: flex;
            justify-content: space-between;
            transition: color .5s;
            flex-wrap: wrap;
            gap: 4px;
        }

        .kbd-hint {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(8px);
            font-size: 10px;
            letter-spacing: .1em;
            color: var(--muted);
            opacity: 0;
            pointer-events: none;
            transition: opacity .4s, transform .4s;
            white-space: nowrap;
            z-index: 50;
        }

        .kbd-hint.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .kbd-hint kbd {
            display: inline-block;
            border: 1px solid var(--border);
            border-radius: 3px;
            padding: 1px 5px;
            font-family: inherit;
            color: var(--accent);
        }

        @media (max-width: 480px) {
            body {
                padding: 44px 20px 52px;
            }
        }
    </style>
</head>

<body>
    <a id="wordmark-btn" href="#" class="wordmark mono" aria-label="Valentin Bell"
        style="position:fixed;top:20px;left:20px;z-index:100;height:48px;display:flex;align-items:center;font-size:11px;letter-spacing:.2em;color:var(--accent);text-decoration:none;opacity:.85;transition:opacity .2s;">VALEBELL</a>

    <div id="cursor" aria-hidden="true">
        <div id="cursor-ring"></div>
    </div>

    <div class="kbd-hint mono" id="kbd-hint" aria-hidden="true">
        press <kbd>T</kbd> to toggle theme
    </div>

    <button type="button" class="toggle" onclick="toggleTheme()" aria-label="Switch to light mode" aria-pressed="false">
        <span class="material-icons-round" id="toggle-icon">light_mode</span>
    </button>

    <div class="card">

        <div class="top-meta stagger-in" style="animation-delay: 0.1s;">
            <span class="boot-status-text offline" aria-live="polite" id="boot-status"></span>
            <div class="tm-right mono">
                <span style="font-size:9px;letter-spacing:.1em;color:var(--muted);opacity:.4;">v2.0.26</span>
            </div>
        </div>

        <h1 class="name stagger-in" style="animation-delay: 0.2s;">Valentin <em>Bell</em></h1>

        <div class="subtitle stagger-in" style="animation-delay: 0.3s;" aria-label="Tagline">
            <span class="subtitle-text" id="subtitle-text"></span>
        </div>

        <nav class="links stagger-in" style="animation-delay: 0.4s;" aria-label="Social links">
            <button type="button" class="lnk mono lnk-email" id="email-btn" aria-label="Copy email address"
                onclick="copyEmail()">
                <span class="lnk-default">
                    <span class="material-icons-round">mail</span>Email
                </span>
                <span class="copy-label" aria-hidden="true">
                    <span class="material-icons-round" style="font-size:11px;">check</span>Copied
                </span>
            </button>

            <a class="lnk mono" href="https://www.linkedin.com/in/valentinbell/" target="_blank"
                rel="noopener noreferrer" aria-label="LinkedIn profile (opens in new tab)">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                        d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z" />

            <a class="lnk mono" href="https://github.com/valebell" target="_blank" rel="noopener noreferrer"
                aria-label="GitHub profile (opens in new tab)">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                        d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12" />

            <div class="lnk mono avail-pill" role="status" aria-label="Available for work">
                <span class="adot"></span>Available

        </nav>

        <div class="now-bar stagger-in" style="animation-delay: 0.55s;" aria-label="Current activity">

            <div class="now-item">
                <div class="now-icon" aria-hidden="true"><span class="material-icons-round">graphic_eq</span></div>
                <div class="now-text mono">
                    <div class="now-label">vibing to</div>
                    <a id="lb-link" href="https://listenbrainz.org/user/valebell/" target="_blank"
                        rel="noopener noreferrer" class="now-link" aria-label="View on ListenBrainz">
                        <div class="now-primary" id="lb-primary" aria-live="polite">· · ·</div>
                        <div class="now-secondary" id="lb-secondary"></div>

                        <div class="waveform-bar" style="height:5px"></div>

                        <div class="waveform-bar" style="height:11px"></div>
                        <div class="waveform-bar" style="height:6px"></div>
                    </div>
                </div>
            </div>

            <div class="now-item">
                <div class="now-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path
                            d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12" />
                    </svg>
                </div>
                <div class="now-text mono">
                    <div class="now-label">last commit</div>
                    <a id="gh-link" href="https://github.com/valebell" target="_blank" rel="noopener noreferrer"
                        class="now-link" aria-label="View latest GitHub commit">
                        <div class="now-primary" id="gh-primary">· · ·</div>

                    <div class="now-secondary" id="gh-secondary"></div>

        <div class="foot mono stagger-in" style="animation-delay: 0.7s;">
            <span>Bangkok, Thailand</span>
            <span id="foot-clock" aria-label="Local time">--:-- ICT</span>
        </div>

    </div>

    <script>
        const BOOT_ONLINE_DELAY = 1500;
        const BOOT_FADE_DELAY = 3000;
        const CLOCK_INTERVAL = 1000;
        const LB_POLL_INTERVAL = 30000;
        const GH_POLL_INTERVAL = 300000;
        const EMAIL = 'contact@valentinbell.dev';
        const LB_USER = 'valebell';
        const GH_USER = 'valebell';

        const SUBTITLE_LINES = [
            'Building things that fit in pockets.',
            "The stack shifts. The drive to learn doesn't.",
            'Clean architecture, messy problems.',
            'Tinkering with AI agents in my spare time.',
            'Paris → Bangkok → Wherever',
        ];
        const SUBTITLE_DISPLAY_MS = 2650;
        const SUBTITLE_SHAKE_MS = 550;

        const statusText = document.getElementById('boot-status');
        const toggleBtn = document.querySelector('.toggle');
        const toggleIcon = document.getElementById('toggle-icon');
        const footClock = document.getElementById('foot-clock');
        const ghPrimary = document.getElementById('gh-primary');
        const ghSecondary = document.getElementById('gh-secondary');
        const ghLink = document.getElementById('gh-link');
        const lbPrimary = document.getElementById('lb-primary');
        const lbSecondary = document.getElementById('lb-secondary');
        const lbLink = document.getElementById('lb-link');
        const waveform = document.getElementById('waveform');
        const emailBtn = document.getElementById('email-btn');
        const kbdHint = document.getElementById('kbd-hint');
        const cursorEl = document.getElementById('cursor');

        document.addEventListener('mousemove', e => {
            cursorEl.style.left = `${e.clientX}px`;
            cursorEl.style.top = `${e.clientY}px`;
        });
        document.addEventListener('mouseleave', () => { cursorEl.style.opacity = '0'; });
        document.addEventListener('mouseenter', () => { cursorEl.style.opacity = '1'; });

        const CLICKABLE_SELECTOR = 'a, button, [role="button"], label, .stack-tag, .now-link';
        let hoverables = new WeakSet(document.querySelectorAll(CLICKABLE_SELECTOR));

        const hoverObserver = new MutationObserver(() => {
            hoverables = new WeakSet(document.querySelectorAll(CLICKABLE_SELECTOR));
        });
        hoverObserver.observe(document.body, { childList: true, subtree: true });

        document.addEventListener('mouseover', e => {
            if (e.target.closest && e.target.closest(CLICKABLE_SELECTOR)) {
                cursorEl.classList.add('is-hovering');
            }
        });
        document.addEventListener('mouseout', e => {
            if (e.target.closest && e.target.closest(CLICKABLE_SELECTOR)) {
                cursorEl.classList.remove('is-hovering');
            }
        });

        window.addEventListener('load', () => {
            requestAnimationFrame(() => { statusText.textContent = 'SYSTEM OFFLINE'; });

            setTimeout(() => {
                statusText.classList.replace('offline', 'online');
                statusText.textContent = 'SYSTEM ONLINE';
                setTimeout(() => statusText.classList.add('hidden'), BOOT_FADE_DELAY);
            }, BOOT_ONLINE_DELAY);

            setTimeout(() => {
                if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
                    kbdHint.classList.add('show');
                    setTimeout(() => kbdHint.classList.remove('show'), 3500);
                }
            }, 2000);
        });

        const clockFmt = new Intl.DateTimeFormat('en-GB', {
            timeZone: 'Asia/Bangkok',
            hour: '2-digit', minute: '2-digit', hour12: false,
        });

        function tick() { footClock.textContent = `${clockFmt.format(new Date())} ICT`; }
        tick();
        setInterval(tick, CLOCK_INTERVAL);

        function toggleTheme() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
            toggleIcon.textContent = isDark ? 'dark_mode' : 'light_mode';
            toggleBtn.setAttribute('aria-label', isDark ? 'Switch to dark mode' : 'Switch to light mode');
            toggleBtn.setAttribute('aria-pressed', String(!isDark));
        }

        document.addEventListener('keydown', e => {
            if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
            if (e.key === 't' || e.key === 'T') toggleTheme();
        });

        let copyTimer = null;
        function copyEmail() {
            if (!navigator.clipboard) {
                try {
                    const ta = document.createElement('textarea');
                    ta.value = EMAIL;
                    ta.style.position = 'fixed';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    showCopied();
                } catch {
                    // silent fail, don't do anything more
                }
                return;
            }

            navigator.clipboard.writeText(EMAIL)
                .then(showCopied)
                .catch(() => {
                    // clipboard write was denied, no visual feedback change
                });
        }

        function showCopied() {
            emailBtn.classList.add('copied');
            clearTimeout(copyTimer);
            copyTimer = setTimeout(() => emailBtn.classList.remove('copied'), 2000);
        }

        const subtitleEl = document.getElementById('subtitle-text');
        let lineIndex = 0;

        function setSubtitleAnim(name) {
            subtitleEl.classList.remove('glitch-in', 'shaking', 'glitch-out');
            void subtitleEl.offsetWidth;
            if (name) subtitleEl.classList.add(name);
        }

        function nextPhrase() {
            subtitleEl.textContent = SUBTITLE_LINES[lineIndex];
            setSubtitleAnim('glitch-in');

            setTimeout(() => {
                setSubtitleAnim('shaking');

                setTimeout(() => {
                    setSubtitleAnim('glitch-out');
                    subtitleEl.addEventListener('animationend', () => {
                        lineIndex = (lineIndex + 1) % SUBTITLE_LINES.length;
                        setTimeout(nextPhrase, 20);
                    }, { once: true });
                }, SUBTITLE_SHAKE_MS);

            }, SUBTITLE_DISPLAY_MS);
        }

        setTimeout(nextPhrase, 900);

        function resolveTrackUrl(additionalInfo, mbid) {
            if (additionalInfo?.music_service === 'youtube.com' && additionalInfo?.origin_url) {
                return additionalInfo.origin_url;
            }
            if (mbid) return `https://musicbrainz.org/recording/${mbid}`;
            return `https://listenbrainz.org/user/${LB_USER}/`;
        }

        function setTrack(title, artist, isLive, additionalInfo, mbid) {
            lbPrimary.textContent = (title ?? 'Unknown track').slice(0, 44);
            lbSecondary.textContent = artist ?? '';
            lbLink.href = resolveTrackUrl(additionalInfo, mbid);
            waveform.classList.add('playing');
            waveform.classList.remove('hidden');
        }

        function clearTrack() {
            lbPrimary.textContent = '— quiet —';
            lbSecondary.textContent = '';
            waveform.classList.remove('playing');
            waveform.classList.add('hidden');
        }

        async function loadListenBrainz() {
            try {
                const nowRes = await fetch(`https://api.listenbrainz.org/1/user/${LB_USER}/playing-now`);
                if (!nowRes.ok) throw new Error(`LB ${nowRes.status}`);
                const nowData = await nowRes.json();

                if (nowData?.payload?.count > 0) {
                    const t = nowData.payload.listens[0]?.track_metadata;
                    if (t) {
                        setTrack(t.track_name, t.artist_name, true, t.additional_info, t.mbid_mapping?.recording_mbid);
                        return;
                    }
                }

                const recRes = await fetch(`https://api.listenbrainz.org/1/user/${LB_USER}/listens?count=1`);
                if (!recRes.ok) throw new Error(`LB ${recRes.status}`);
                const recData = await recRes.json();

                if (recData?.payload?.listens?.length > 0) {
                    const t = recData.payload.listens[0]?.track_metadata;
                    if (t) {
                        setTrack(t.track_name, t.artist_name, false, t.additional_info, t.mbid_mapping?.recording_mbid);
                        return;
                    }
                }

                clearTrack();
            } catch (err) {
                console.warn('ListenBrainz fetch failed:', err);
                clearTrack();
            }
        }

        loadListenBrainz();
        setInterval(loadListenBrainz, LB_POLL_INTERVAL);

        function timeAgo(date) {
            const s = Math.floor((Date.now() - date) / 1000);
            if (s < 60) return `${s}s ago`;
            if (s < 3600) return `${Math.floor(s / 60)}m ago`;
            const h = Math.floor(s / 3600);
            if (h < 24) return `${h}h ago`;
            return `${Math.floor(h / 24)}d ago`;
        }

        function setCommit(text, href, meta) {
            ghPrimary.textContent = text;
            ghLink.href = href;
            ghSecondary.textContent = meta;
        }

        const GH_EVENT_EXTRACTORS = {
            PullRequestEvent: (ev) => {
                const pr = ev.payload?.pull_request;
                return pr?.title ? { text: pr.title, href: pr.html_url } : null;
            },
            PushEvent: (ev) => {
                const commit = ev.payload?.commits?.find(c => c.message?.trim());
                if (!commit) return null;
                return {
                    text: commit.message.split('\n')[0],
                    href: `https://github.com/${ev.repo.name}/commit/${commit.sha}`,
                };
            },
            CreateEvent: (ev) => {
                const label = ev.payload?.description?.trim()
                    || (ev.payload?.ref ? `created ${ev.payload.ref_type} ${ev.payload.ref}` : null);
                return label ? { text: label, href: `https://github.com/${ev.repo.name}` } : null;
            },
        };

        async function loadGH() {
            try {
                const res = await fetch(`https://api.github.com/users/${GH_USER}/events/public`);
                if (res.status === 403 || res.status === 429) {
                    setCommit('rate limit — try later', ghLink.href, '');
                    return;
                }
                if (!res.ok) throw new Error(`GitHub Events API ${res.status}`);
                const events = await res.json();

                const pushEvent = events.find(ev => ev.type === 'PushEvent');

                if (pushEvent && pushEvent.payload?.head) {
                    const repoName = pushEvent.repo.name;
                    const headSha = pushEvent.payload.head;
                    const repoLabel = repoName.split('/')[1] || repoName;

                    const commitRes = await fetch(`https://api.github.com/repos/${repoName}/commits/${headSha}`);

                    if (commitRes.ok) {
                        const commitData = await commitRes.json();
                        const commitMessage = commitData.commit.message.split('\n')[0];
                        const commitUrl = commitData.html_url;

                        setCommit(commitMessage, commitUrl, `${repoLabel} · ${timeAgo(new Date(pushEvent.created_at))}`);
                        return;
                    } else if (commitRes.status === 403 || commitRes.status === 429) {
                        setCommit('commit fetched (rate limited)', `https://github.com/${repoName}/commit/${headSha}`, `${repoLabel} · ${timeAgo(new Date(pushEvent.created_at))}`);
                        return;
                    }
                }

                ghPrimary.textContent = 'no recent commits';
            } catch (err) {
                console.warn('GitHub fetch failed:', err);
                setCommit('unavailable', ghLink.href, '');
            }
        }

        loadGH();

        const wordmarkBtn = document.getElementById('wordmark-btn');

        const gimmickMessages = [
            "hey there!",
            "yes, this is clickable.",
            "wait, the signal is...",
            "i'm losing the conne—",
            "st—p cl—ck—ng..."
        ];
        let wordmarkClicks = 0;
        let isGimmickAnimating = false;

        wordmarkBtn.addEventListener('click', (e) => {
            e.preventDefault();
            if (isGimmickAnimating) return;

            if (wordmarkClicks < gimmickMessages.length) {
                isGimmickAnimating = true;

                const angle = (Math.random() * 30 - 15).toFixed(1);
                const rect = wordmarkBtn.getBoundingClientRect();

                const wrapper = document.createElement('span');
                wrapper.style.position = 'fixed';
                wrapper.style.left = `${rect.right + 10}px`;
                wrapper.style.top = `${rect.top + rect.height * 0.6}px`;
                wrapper.style.transform = `rotate(${angle}deg)`;
                wrapper.style.pointerEvents = 'none';
                wrapper.style.zIndex = '9998';

                const popup = document.createElement('span');
                popup.className = 'subtitle-text';
                popup.textContent = gimmickMessages[wordmarkClicks];
                popup.style.position = 'relative';
                popup.style.display = 'inline-block';
                popup.style.color = 'var(--fg)';
                popup.style.whiteSpace = 'nowrap';
                popup.style.textTransform = 'lowercase';

                wrapper.appendChild(popup);
                document.body.appendChild(wrapper);

                wordmarkBtn.style.transform = 'scale(0.95)';
                setTimeout(() => { wordmarkBtn.style.transform = 'scale(1)'; }, 100);

                popup.classList.add('glitch-in');

                setTimeout(() => {
                    popup.classList.replace('glitch-in', 'shaking');

                    setTimeout(() => {
                        popup.classList.replace('shaking', 'glitch-out');

                        popup.addEventListener('animationend', () => {
                            wrapper.remove();
                            isGimmickAnimating = false;
                            wordmarkClicks++;
                        }, { once: true });

                    }, 550);
                }, 1200);

            } else if (wordmarkClicks === gimmickMessages.length) {
                wordmarkBtn.textContent = "VALEBELL - END OF TRANSMISSION";
                wordmarkBtn.style.pointerEvents = 'none';
                wordmarkBtn.style.opacity = '0.4';
                wordmarkBtn.style.whiteSpace = 'nowrap';
            }
        });
    </script>
